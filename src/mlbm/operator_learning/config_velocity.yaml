output_name: FNOkarmanVelocity

hydra:
  run:
    dir: ./${output_name}/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

output:
  dir: ./${output_name}

data:
  base_folder: /home/jwinter/Development/TorchLBM/cases/dataset_creation
  num_channels: 2
  normalization_mean:
  - 0.020051
  - 0.0
  normalization_std:
  - 0.0034
  - 0.0037
  field_name: velocity

arch:
  decoder:
    out_features: ${data.num_channels}
    layers: 1
    layer_size: 128

  fno:
    in_channels: ${data.num_channels}
    dimension: 2
    latent_channels: 24
    fno_layers: 4
    fno_modes: 64
    padding: 9

scheduler:
  initial_lr: 1.E-3
  decay_rate: .85
  decay_pseudo_epochs: 8

training:
  resolution: 256
  batch_size: 32
  rec_results_freq : 32
  max_pseudo_epochs: 256
  pseudo_epoch_sample_size: 2048

validation:
  sample_size: 256
  validation_pseudo_epochs: 16
